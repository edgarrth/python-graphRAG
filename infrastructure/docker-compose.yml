name: axiz-graphrag-payments-poc

x-backend-image: &backend-image
  image: axiz-graphrag-payments-poc-app:1.4.0
  build:
    context: ..
    dockerfile: infrastructure/app.Dockerfile

x-backend-environment: &backend-environment
  NEO4J_URI: neo4j://neo4j:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-axiz-graphrag-poc}
  NEO4J_DATABASE: neo4j
  EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  VECTOR_INDEX_NAME: knowledge_embedding
  FULLTEXT_INDEX_NAME: knowledge_fulltext
  HYBRID_RANKER: ${HYBRID_RANKER:-linear}
  HYBRID_ALPHA: ${HYBRID_ALPHA:-0.35}
  EFFECTIVE_SEARCH_RATIO: ${EFFECTIVE_SEARCH_RATIO:-3}
  HF_HOME: /root/.cache/huggingface

services:
  neo4j:
    image: neo4j:2026.08.1
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-axiz-graphrag-poc}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-axiz-graphrag-poc} 'RETURN 1;' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  dataset-loader:
    <<: *backend-image
    command: ["python", "datasets/load_dataset.py"]
    environment:
      <<: *backend-environment
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-image
    environment:
      <<: *backend-environment
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      dataset-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/frontend.Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
  hf_cache:
